name: Velora Chocolates CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 188244334939.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_REPOSITORY: velora-chocolates-backend
  FRONTEND_REPOSITORY: velora-chocolates-frontend
  EC2_INSTANCE_ID: i-02cc7fc30412b007e

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::188244334939:role/velora-chocolates-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -t $ECR_REGISTRY/$BACKEND_REPOSITORY:${GITHUB_SHA} \
            -t $ECR_REGISTRY/$BACKEND_REPOSITORY:latest \
            ./server

      - name: Build frontend image
        run: |
          docker build \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:${GITHUB_SHA} \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:latest \
            ./client

      - name: Push backend image
        run: |
          docker push $ECR_REGISTRY/$BACKEND_REPOSITORY:${GITHUB_SHA}
          docker push $ECR_REGISTRY/$BACKEND_REPOSITORY:latest

      - name: Push frontend image
        run: |
          docker push $ECR_REGISTRY/$FRONTEND_REPOSITORY:${GITHUB_SHA}
          docker push $ECR_REGISTRY/$FRONTEND_REPOSITORY:latest

      - name: Validate production Compose file
        run: |
          docker compose -f docker-compose.prod.yml config

      - name: Deploy to EC2 via SSM
        run: |
          COMPOSE_FILE=$(base64 -w 0 docker-compose.prod.yml)

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -e\",
              \"mkdir -p /root/velora-chocolates\",
              \"echo $COMPOSE_FILE | base64 -d > /root/velora-chocolates/docker-compose.prod.yml\",
              \"cd /root/velora-chocolates\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"IMAGE_TAG=$GITHUB_SHA docker compose -f docker-compose.prod.yml pull\",
              \"IMAGE_TAG=$GITHUB_SHA docker compose -f docker-compose.prod.yml up -d\",
              \"sleep 15\",
              \"docker compose -f docker-compose.prod.yml ps\",
              \"test \\\"\\$(docker inspect -f '{{.State.Health.Status}}' velora-api)\\\" = healthy\",
              \"test \\\"\\$(docker inspect -f '{{.State.Health.Status}}' velora-frontend)\\\" = healthy\",
              \"curl -fsS https://velorachocolates.store/ > /dev/null\",
              \"curl -fsS https://velorachocolates.store/api/products > /dev/null\",
              \"docker image prune -f\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          echo "===== EC2 DEPLOYMENT OUTPUT ====="

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

      - name: Deployment completed
        run: |
          echo "Velora Chocolates deployment completed successfully."
          echo "Commit: $GITHUB_SHA"
