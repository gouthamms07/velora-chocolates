name: Velora Chocolates CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 188244334939.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_REPOSITORY: velora-chocolates-backend
  FRONTEND_REPOSITORY: velora-chocolates-frontend
  EC2_INSTANCE_ID: i-02cc7fc30412b007e

jobs:
  build-and-deploy:
    name: Build and Deploy Velora Chocolates
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::188244334939:role/velora-chocolates-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:$GITHUB_SHA" \
            -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:latest" \
            ./server

      - name: Build frontend image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$GITHUB_SHA" \
            -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:latest" \
            ./client

      - name: Push backend image
        run: |
          docker push "$ECR_REGISTRY/$BACKEND_REPOSITORY:$GITHUB_SHA"
          docker push "$ECR_REGISTRY/$BACKEND_REPOSITORY:latest"

      - name: Push frontend image
        run: |
          docker push "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$GITHUB_SHA"
          docker push "$ECR_REGISTRY/$FRONTEND_REPOSITORY:latest"

      - name: Validate production Compose file
        run: |
          docker compose -f docker-compose.prod.yml config

      - name: Prepare deployment data
        run: |
          echo "===== PREPARING DEPLOYMENT DATA ====="

          base64 -w 0 docker-compose.prod.yml > compose.b64

          echo "COMPOSE_B64=$(cat compose.b64)" >> "$GITHUB_ENV"

          echo "Deployment data prepared."

      - name: Deploy to EC2 via SSM
        run: |
          echo "===== SENDING DEPLOYMENT COMMAND ====="

          jq -n \
            --arg instance "$EC2_INSTANCE_ID" \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg compose "$COMPOSE_B64" \
            --arg image_tag "$GITHUB_SHA" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance],
              Parameters: {
                commands: [
                  "set -e",
                  "echo \"===== PREPARING DEPLOYMENT DIRECTORY =====\"",
                  "mkdir -p /root/velora-chocolates",
                  ("echo " + $compose + " | base64 -d > /root/velora-chocolates/docker-compose.prod.yml"),
                  "cd /root/velora-chocolates",
                  "echo \"===== ECR LOGIN =====\"",
                  ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
                  "echo \"===== PULLING IMAGES =====\"",
                  ("IMAGE_TAG=" + $image_tag + " docker compose -f docker-compose.prod.yml pull"),
                  "echo \"===== STARTING CONTAINERS =====\"",
                  ("IMAGE_TAG=" + $image_tag + " docker compose -f docker-compose.prod.yml up -d"),
                  "echo \"===== WAITING FOR CONTAINERS =====\"",
                  "sleep 20",
                  "echo \"===== CONTAINER STATUS =====\"",
                  "docker compose -f docker-compose.prod.yml ps",
                  "echo \"===== API HEALTH CHECK =====\"",
                  "docker exec velora-api wget --spider -q http://localhost:4000/health",
                  "echo \"API health: OK\"",
                  "echo \"===== FRONTEND HEALTH CHECK =====\"",
                  "docker exec velora-frontend wget --spider -q http://127.0.0.1/",
                  "echo \"Frontend health: OK\"",
                  "echo \"===== WEBSITE HTTPS CHECK =====\"",
                  "curl -fsS https://velorachocolates.store/ > /dev/null",
                  "echo \"Website HTTPS: OK\"",
                  "echo \"===== API ENDPOINT CHECK =====\"",
                  "curl -fsS https://velorachocolates.store/api/products > /dev/null",
                  "echo \"API endpoint: OK\"",
                  "echo \"===== DEPLOYED IMAGES =====\"",
                  "docker inspect velora-api --format \"{{.Config.Image}}\"",
                  "docker inspect velora-frontend --format \"{{.Config.Image}}\"",
                  "echo \"===== CLEANING UNUSED IMAGES =====\"",
                  "docker image prune -f",
                  "echo \"===== DEPLOYMENT SUCCESS =====\""
                ]
              }
            }' > ssm-command.json

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --cli-input-json file://ssm-command.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "===== WAITING FOR SSM COMMAND ====="

          set +e

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          WAIT_STATUS=$?

          set -e

          echo "===== EC2 DEPLOYMENT OUTPUT ====="

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          if [ "$WAIT_STATUS" -ne 0 ]; then
            echo "=========================================="
            echo "EC2 DEPLOYMENT FAILED"
            echo "=========================================="
            exit "$WAIT_STATUS"
          fi

          echo "=========================================="
          echo "EC2 DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

      - name: Deployment completed
        run: |
          echo "=========================================="
          echo "Velora Chocolates deployment completed."
          echo "=========================================="
          echo "Commit: $GITHUB_SHA"
          echo "Backend:"
          echo "$ECR_REGISTRY/$BACKEND_REPOSITORY:$GITHUB_SHA"
          echo "Frontend:"
          echo "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$GITHUB_SHA"
