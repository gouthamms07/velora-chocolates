name: Kubernetes CI/CD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 188244334939.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_REPOSITORY: velora-chocolates-backend
  FRONTEND_REPOSITORY: velora-chocolates-frontend
  K8S_NAMESPACE: velora
  EC2_INSTANCE_ID: i-02cc7fc30412b007e

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::188244334939:role/velora-chocolates-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:${GITHUB_SHA}" \
            ./server

          docker push \
            "$ECR_REGISTRY/$BACKEND_REPOSITORY:${GITHUB_SHA}"

      - name: Build and push frontend image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:${GITHUB_SHA}" \
            ./client

          docker push \
            "$ECR_REGISTRY/$FRONTEND_REPOSITORY:${GITHUB_SHA}"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply \
            --dry-run=client \
            -f k8s/namespace.yaml \
            -f k8s/backend-storage.yaml \
            -f k8s/backend.yaml \
            -f k8s/frontend.yaml

      - name: Deploy to Kubernetes through AWS SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > /tmp/deploy-k8s.sh <<SCRIPT
          #!/bin/bash
          set -euo pipefail

          export KUBECONFIG=/etc/kubernetes/admin.conf

          IMAGE_TAG="${IMAGE_TAG}"
          ECR_REGISTRY="${ECR_REGISTRY}"
          AWS_REGION="${AWS_REGION}"
          NAMESPACE="${K8S_NAMESPACE}"

          echo "=== Kubernetes deployment ==="
          echo "Image tag: \$IMAGE_TAG"

          echo "=== Kubernetes context ==="
          kubectl config current-context

          echo "=== Refresh ECR pull secret ==="
          kubectl -n "\$NAMESPACE" create secret docker-registry ecr-registry-secret \
            --docker-server="\$ECR_REGISTRY" \
            --docker-username=AWS \
            --docker-password="\$(aws ecr get-login-password --region "\$AWS_REGION")" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          echo "=== Update backend ==="
          kubectl -n "\$NAMESPACE" set image deployment/velora-backend \
            backend="\$ECR_REGISTRY/velora-chocolates-backend:\$IMAGE_TAG"

          echo "=== Update frontend ==="
          kubectl -n "\$NAMESPACE" set image deployment/velora-frontend \
            frontend="\$ECR_REGISTRY/velora-chocolates-frontend:\$IMAGE_TAG"

          echo "=== Wait for backend rollout ==="
          kubectl -n "\$NAMESPACE" rollout status \
            deployment/velora-backend \
            --timeout=180s

          echo "=== Wait for frontend rollout ==="
          kubectl -n "\$NAMESPACE" rollout status \
            deployment/velora-frontend \
            --timeout=180s

          echo "=== Final deployment status ==="
          kubectl -n "\$NAMESPACE" get deployments
          kubectl -n "\$NAMESPACE" get pods -o wide
          kubectl -n "\$NAMESPACE" get services

          echo "=== Deployment successful ==="
          SCRIPT

          SCRIPT_B64=$(base64 -w 0 /tmp/deploy-k8s.sh)

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Velora Kubernetes deployment ${GITHUB_SHA}" \
            --parameters "commands=[\"echo $SCRIPT_B64 | base64 -d > /tmp/deploy-k8s.sh && chmod +x /tmp/deploy-k8s.sh && /tmp/deploy-k8s.sh\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "=== Waiting for SSM command ==="

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Kubernetes deployment failed."

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text

                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          FINAL_STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'Status' \
            --output text)

          echo "Final SSM status: $FINAL_STATUS"

          if [ "$FINAL_STATUS" != "Success" ]; then
            echo "SSM command did not complete successfully."

            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'StandardErrorContent' \
              --output text

            exit 1
          fi

          echo "=== SSM deployment output ==="

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text
