name: Kubernetes CI/CD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 188244334939.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_REPOSITORY: velora-chocolates-backend
  FRONTEND_REPOSITORY: velora-chocolates-frontend
  K8S_NAMESPACE: velora
  EC2_INSTANCE_ID: i-02cc7fc30412b007e

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)

          echo "$PAYLOAD" | jq '{
            sub,
            aud,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            ref,
            event_name,
            workflow,
            workflow_ref
          }'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::188244334939:role/velora-chocolates-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          set -euo pipefail

          docker build \
            -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:${GITHUB_SHA}" \
            ./server

          docker push \
            "$ECR_REGISTRY/$BACKEND_REPOSITORY:${GITHUB_SHA}"

      - name: Build and push frontend image
        run: |
          set -euo pipefail

          docker build \
            -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:${GITHUB_SHA}" \
            ./client

          docker push \
            "$ECR_REGISTRY/$FRONTEND_REPOSITORY:${GITHUB_SHA}"

      - name: Check Kubernetes manifest files
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Checking Kubernetes manifest files ==="

          test -f k8s/namespace.yaml
          test -f k8s/backend-storage.yaml
          test -f k8s/backend.yaml
          test -f k8s/frontend.yaml

          echo "All Kubernetes manifest files are present."

      - name: Deploy to Kubernetes through AWS SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/deploy-k8s.sh <<SCRIPT
          #!/bin/bash
          set -euo pipefail

          export KUBECONFIG=/etc/kubernetes/admin.conf

          IMAGE_TAG="${IMAGE_TAG}"
          ECR_REGISTRY="${ECR_REGISTRY}"
          AWS_REGION="${AWS_REGION}"
          NAMESPACE="${K8S_NAMESPACE}"

          echo "========================================"
          echo "Velora Chocolates Kubernetes Deployment"
          echo "========================================"

          echo "Image tag: \$IMAGE_TAG"
          echo "Namespace: \$NAMESPACE"
          echo "AWS Region: \$AWS_REGION"

          echo ""
          echo "=== Kubernetes context ==="

          kubectl config current-context

          echo ""
          echo "=== Kubernetes cluster ==="

          kubectl cluster-info

          echo ""
          echo "=== Checking namespace ==="

          kubectl get namespace "\$NAMESPACE"

          echo ""
          echo "=== Refresh ECR pull secret ==="

          kubectl -n "\$NAMESPACE" create secret docker-registry ecr-registry-secret \
            --docker-server="\$ECR_REGISTRY" \
            --docker-username=AWS \
            --docker-password="\$(aws ecr get-login-password --region "\$AWS_REGION")" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          echo ""
          echo "=== Update backend image ==="

          kubectl -n "\$NAMESPACE" set image \
            deployment/velora-backend \
            backend="\$ECR_REGISTRY/velora-chocolates-backend:\$IMAGE_TAG"

          echo ""
          echo "=== Update frontend image ==="

          kubectl -n "\$NAMESPACE" set image \
            deployment/velora-frontend \
            frontend="\$ECR_REGISTRY/velora-chocolates-frontend:\$IMAGE_TAG"

          echo ""
          echo "=== Wait for backend rollout ==="

          kubectl -n "\$NAMESPACE" rollout status \
            deployment/velora-backend \
            --timeout=180s

          echo ""
          echo "=== Wait for frontend rollout ==="

          kubectl -n "\$NAMESPACE" rollout status \
            deployment/velora-frontend \
            --timeout=180s

          echo ""
          echo "=== Backend rollout history ==="

          kubectl -n "\$NAMESPACE" rollout history deployment/velora-backend

          echo ""
          echo "=== Frontend rollout history ==="

          kubectl -n "\$NAMESPACE" rollout history deployment/velora-frontend

          echo ""
          echo "=== Final deployments ==="

          kubectl -n "\$NAMESPACE" get deployments -o wide

          echo ""
          echo "=== Final pods ==="

          kubectl -n "\$NAMESPACE" get pods -o wide

          echo ""
          echo "=== Final services ==="

          kubectl -n "\$NAMESPACE" get services -o wide

          echo ""
          echo "========================================"
          echo "Kubernetes deployment successful"
          echo "========================================"

          SCRIPT

          SCRIPT_B64=$(base64 -w 0 /tmp/deploy-k8s.sh)

          echo "=== Sending deployment command through AWS SSM ==="

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Velora Kubernetes deployment ${GITHUB_SHA}" \
            --parameters "commands=[\"echo $SCRIPT_B64 | base64 -d > /tmp/deploy-k8s.sh && chmod +x /tmp/deploy-k8s.sh && /tmp/deploy-k8s.sh\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo ""
          echo "=== Waiting for SSM command ==="

          FINAL_STATUS="Pending"

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            case "$STATUS" in

              Success)
                FINAL_STATUS="Success"
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                FINAL_STATUS="$STATUS"
                break
                ;;

              *)
                sleep 5
                ;;

            esac

          done

          echo ""
          echo "=== Final SSM status ==="
          echo "$FINAL_STATUS"

          echo ""
          echo "=== SSM standard output ==="

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text

          echo ""
          echo "=== SSM standard error ==="

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text

          if [ "$FINAL_STATUS" != "Success" ]; then
            echo ""
            echo "Kubernetes deployment failed."
            exit 1
          fi

          echo ""
          echo "Kubernetes deployment completed successfully."
