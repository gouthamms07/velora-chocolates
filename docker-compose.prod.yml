services:
  api:
    image: 188244334939.dkr.ecr.ap-south-1.amazonaws.com/velora-chocolates-backend:latest
    container_name: velora-api
    restart: unless-stopped
    environment:
      PORT: 4000
      CLIENT_ORIGIN: https://velorachocolates.store
      DATABASE_FILE: /app/data/velora.db
    expose:
      - "4000"
    volumes:
      - velora_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: 188244334939.dkr.ecr.ap-south-1.amazonaws.com/velora-chocolates-frontend:latest
    container_name: velora-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  velora_data:
