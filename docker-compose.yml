services:
  api:
    build:
      context: ./server
    environment:
      PORT: 4000
      CLIENT_ORIGIN: http://velora.local:5173
      DATABASE_FILE: /app/data/velora.db
    ports:
      - "4000:4000"
    volumes:
      - velora_data:/app/data

  frontend:
    build:
      context: ./client
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  velora_data:
