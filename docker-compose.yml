services:
  api:
    build:
      context: ./server
    environment:
      PORT: 4000
      CLIENT_ORIGIN: http://velora.local:5173
      DATABASE_FILE: /app/data/velora.db
    ports:
      - "4000:4000"
    volumes:
      - velora_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./client
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  velora_data:
