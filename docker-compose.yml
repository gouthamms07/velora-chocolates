services:
  api:
    build:
      context: ./server
    environment:
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
      DATABASE_FILE: /app/data/velora.db
    ports:
      - "4000:4000"
    volumes:
      - velora_data:/app/data

  frontend:
    build:
      context: ./client
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  velora_data:
