apiVersion: apps/v1
kind: Deployment
metadata:
  name: velora-frontend
  namespace: velora
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: velora-frontend
  template:
    metadata:
      labels:
        app: velora-frontend
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: frontend
          image: 188244334939.dkr.ecr.ap-south-1.amazonaws.com/velora-chocolates-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_HOST
              value: velora-backend:4000
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: velora-frontend
  namespace: velora
spec:
  type: NodePort
  selector:
    app: velora-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
